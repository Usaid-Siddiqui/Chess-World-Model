# Real run on a single cloud GPU. ~25M-param backbone; reproduces the ~99% board
# probe on real Lichess data in a few GPU-hours.
seed: 0

model:
  ctx: 512
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.1             # regularization; helps against overfitting on repeated data
  bias: true

train:
  batch_size: 384          # A100 80GB has plenty of room for this + bf16
  lr: 6.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  epochs: 8                # steps derived from dataset size (not a hardcoded step count)
  warmup_frac: 0.05        # warmup = 5% of derived steps
  log_every: 100
  eval_every: 2000         # val loss + checkpoint every N steps (crash-safe; probe externally)

jepa:
  ema_decay: 0.999
  rollout_steps: 5
  predictor_layers: 3
  vicreg_weight: 0.0
